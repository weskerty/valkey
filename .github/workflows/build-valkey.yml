name: Build Valkey Binaries

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-valkey:
    name: Build Valkey ${{ matrix.arch }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            output: valkey-server-linux-x64
          - arch: arm64
            platform: linux/arm64
            output: valkey-server-linux-arm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Valkey
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v $(pwd):/output \
            gcc:latest bash -c "
              apt-get update && apt-get install -y git make
              git clone https://github.com/valkey-io/valkey.git
              cd valkey
              git checkout 9.0.0
              make LDFLAGS='-static'
              strip src/valkey-server
              cp src/valkey-server /output/${{ matrix.output }}
              cp COPYING /output/LICENSE-valkey
            "
      
      - name: Verify binary
        run: |
          ls -lh ${{ matrix.output }}
          file ${{ matrix.output }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            ${{ matrix.output }}
            LICENSE-valkey
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.output }}
            LICENSE-valkey
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
